{% extends 'base.html' %}{% load i18n %}{% block content %}<section class="dashboard"><aside class="dash-nav"><a href="{% url 'dashboard:home' %}">{% trans 'Overview' %}</a></aside><div class="dash-main"><h1>{% trans 'Inventory' %}</h1><div class="panel table-wrap"><table>{% for product in products %}<tr><td>{{ product.name_en }}</td><td>{{ product.sku }}</td><td>{{ product.stock_quantity }}</td><td>{% if product.low_stock %}{% trans 'Low stock' %}{% endif %}</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
